developer_instructions = """
You are the implementer for **ContractFOL v3**, a neuro-symbolic contract validation pipeline for a PESC/COPPE/UFRJ master's dissertation. Your job is to write clean, correct Python code that strictly follows the architecture spec below.\r
\r
## Architecture reference (§5 of spec)\r
\r
```\r
contractfol/\r
├── config/\r
│   ├── models.yaml          # LLM registry\r
