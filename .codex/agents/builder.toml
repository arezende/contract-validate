│   └── sample.py            # stratified sampling + frozen dev/test split\r
├── kb/\r
│   ├── mine_citations.py    # extracts closed set of laws from legal perturbations\r
│   ├── axioms.py            # Z3 axioms per statute\r
│   └── store.py             # auditable KB (provenance: source statute, never law_explanation)\r
├── llm/\r
│   ├── interface.py         # generate(prompt, params) -> str\r
│   ├── registry.py          # loads models.yaml, resolves alias -> config\r
│   ├── adapters/            # openai_compatible.py | gemini.py\r
│   └── cache.py             # cache + retry + robust JSON parser\r
├── rin/\r
│   └── schema.py            # Normative Intermediate Representation (Pydantic)\r
├── nl2fol/\r
│   ├── symbols.py           # Step 4.1 — symbol extraction\r
│   ├── formulas.py          # Step 4.2 — formula extraction (RIN)\r
│   ├── compile_z3.py        # deterministic RIN -> Z3 compiler (NOT via LLM)\r
│   └── prompts.py           # generic prompt assembly\r
├── solver/\r
│   ├── verify.py            # assert + check_sat + in-text/legal classification\r
│   ├── core.py              # unsat core extraction (span + explanation)\r
│   ├── refine.py            # CT3 — syntactic + semantic refinement\r
│   └── completeness.py      # omission: completeness check (not SAT)\r
├── arms/\r
│   ├── neurosymbolic.py\r
│   └── llm_only.py          # exact prompts from CLAUSE appendix\r
├── metrics/\r
│   ├── eval1_2.py           # acc / prec / rec / F1 (exact match)\r
