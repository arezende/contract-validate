[project]
name = "clause-llm-eval"
version = "0.1.0"
description = "Pipeline Python para avaliar LLMs no benchmark CLAUSE com subamostragem estratificada e bootstrap."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "openai>=1.40",
    "google-genai>=1.0",
]

[project.scripts]
clause-eval = "clause_llm_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
