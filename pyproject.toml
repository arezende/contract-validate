[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractfol"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "z3-solver>=4.12",
    "pydantic>=2.0",
    "openai",
    "anthropic",
    "google-generativeai",
    "httpx",
    "spacy>=3.7",
    "rouge-score==0.1.2",
    "nltk==3.8.1",
    "bert-score==0.3.13",
    "networkx==3.1",
    "pyyaml",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["contractfol*"]
